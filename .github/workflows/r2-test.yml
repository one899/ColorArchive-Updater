name: R2 upload test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Upload test object via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -x
          echo "hello from CI $(date -u)" > test.txt
          npx -y wrangler@latest --version
          npx -y wrangler@latest r2 object put "$R2_BUCKET/test.txt" --file test.txt --remote --content-type text/plain
          echo "=== list ==="
          npx -y wrangler@latest r2 object list "$R2_BUCKET" --remote || true
      - name: Verify public URL
        run: |
          sleep 5
          curl -sS -m 20 "https://pub-6c462a25cbda4703be95b5b17d52816e.r2.dev/test.txt" || echo "not reachable yet"
