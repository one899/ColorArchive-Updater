name: Publish manifest to R2
on:
  workflow_dispatch:
    inputs:
      ko_version:
        description: "kernelsu module version"
        required: true
      boot_version:
        description: "kernel release string"
        required: true
      epoch:
        description: "build epoch seconds"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Write and upload manifest.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          KO_VER="${{ inputs.ko_version }}"
          BOOT_VER="${{ inputs.boot_version }}"
          EP="${{ inputs.epoch }}"
          printf '{"ko":{"version":"%s","build_epoch":%s,"sha256":"","size":0,"name":"kernelsu-stripped.ko"},"boot":{"version":"%s","build_epoch":%s,"sha256":"","size":0,"name":"boot-lkm-9rt.img"}}' "$KO_VER" "$EP" "$BOOT_VER" "$EP" > manifest.json
          cat manifest.json
          npx -y wrangler@latest r2 object put "$R2_BUCKET/manifest.json" --file manifest.json --remote --content-type application/json
          npx -y wrangler@latest r2 object list "$R2_BUCKET" --remote
