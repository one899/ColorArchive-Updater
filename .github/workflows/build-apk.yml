name: Build Updater APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: |
          set -xe
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          PLATFORM=$(ls -d $SDK/platforms/android-* | sort -V | tail -1)
          echo "BT=$BT PLATFORM=$PLATFORM"
          rm -rf build && mkdir -p build/gen build/classes
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLATFORM/android.jar" --manifest AndroidManifest.xml --java build/gen --min-sdk-version 26 --target-sdk-version 34 build/res.zip
          javac -source 11 -target 11 -encoding UTF-8 -classpath "$PLATFORM/android.jar" -d build/classes $(find build/gen -name "*.java") $(find src -name "*.java")
          "$BT/d8" --lib "$PLATFORM/android.jar" --min-api 26 --output build/ $(find build/classes -name "*.class")
          cd build && cp base.apk unsigned.apk && zip -q -u unsigned.apk classes.dex && ls -l
      - name: Sign
        run: |
          set -xe
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          base64 -d keystore.b64 > /tmp/ksu.jks
          cd build
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks /tmp/ksu.jks --ks-pass pass:one899ksu --key-pass pass:one899ksu --ks-key-alias ksu --out ColorArchiveUpdater.apk aligned.apk
          "$BT/apksigner" verify --print-certs ColorArchiveUpdater.apk | head -6
          cp ColorArchiveUpdater.apk "$GITHUB_WORKSPACE/"
          ls -l "$GITHUB_WORKSPACE/ColorArchiveUpdater.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: updater-apk
          path: ColorArchiveUpdater.apk
      - name: Upload APK to Cloudflare R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -x
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "R2 not configured"; exit 0; }
          npx -y wrangler@latest r2 object put "$R2_BUCKET/ColorArchiveUpdater.apk" --file ColorArchiveUpdater.apk --remote --content-type application/vnd.android.package-archive || true
          printf '{"versionCode":5,"versionName":"3.2","url":"https://lkm.colorarchive.cloud/ColorArchiveUpdater.apk"}' > app.json
          cat app.json
          npx -y wrangler@latest r2 object put "$R2_BUCKET/app.json" --file app.json --remote --content-type application/json || true
          npx -y wrangler@latest r2 object list "$R2_BUCKET" --remote || true
      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view lkm-latest >/dev/null 2>&1 || gh release create lkm-latest --title "ColorArchive Updater" --notes "auto build" --latest
          gh release upload lkm-latest ColorArchiveUpdater.apk --clobber
